name: Verify KoolSupport
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check and package
        run: python3 scripts/check.py --package
      - name: Upload development package
        uses: actions/upload-artifact@v4
        with:
          name: KoolSupport-modular-development
          path: dist/*.zip
