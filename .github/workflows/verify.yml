name: Verify KoolSupport
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require handoff update in each PR
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}" --depth=1
          if ! git diff --name-only "origin/${{ github.base_ref }}" HEAD | grep -Fxq "docs/CHAT-TRANSITION.md"; then
            echo "::error file=docs/CHAT-TRANSITION.md::Every PR must update the canonical engineering handoff"
            exit 1
          fi
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Check and package
        run: python3 scripts/check.py --package
      - name: Validate browser preview JavaScript
        run: python3 scripts/check_preview.py
      - name: Validate CurseForge packaging rules
        run: python3 scripts/check_curseforge_packaging.py
      - name: Upload development package
        uses: actions/upload-artifact@v4
        with:
          name: KoolSupport-modular-development
          path: |
            dist/*.zip
            preview/KS_Afflictions_Browser_Preview.html

  curseforge-packager-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run upstream CurseForge-compatible packager without uploading
        uses: BigWigsMods/packager@v2
        with:
          args: -d
      - name: Inspect the exact generated WoW addon ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidates < <(find .release -type f -name 'KoolSupport*.zip' | sort)
          if (( ${#candidates[@]} != 1 )); then
            echo "::error::Expected exactly one CurseForge ZIP, found ${#candidates[@]}"
            find .release -type f || true
            exit 1
          fi
          python3 scripts/check_curseforge_packaging.py --built-zip "${candidates[0]}"
